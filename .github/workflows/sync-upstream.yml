name: Sync Fork With Upstream

# Keeps this fork's main branch up to date with
# solana-foundation/solana-improvement-documents. This file is the only
# fork-specific file in the repository.
#
# Two things stop it, and the failed run's summary says which to fix:
#
# 1. The default token cannot push a sync that changes files under
#    .github/workflows/. Use "Sync fork" on the repository page once, or add a
#    repository secret named SYNC_TOKEN: a fine-grained token for this
#    repository with Contents and Workflows set to read and write (or a classic
#    token with the repo and workflow scopes).
# 2. GitHub pauses scheduled workflows in a public repository after 60 days
#    without repository activity. Re-enable this one from the Actions tab.

on:
  schedule:
    # Run every Monday and Thursday at 05:23 UTC
    - cron: '23 5 * * 1,4'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    # Never run in the upstream repository itself
    if: github.repository != 'solana-foundation/solana-improvement-documents'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main into main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          if out=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main 2>&1); then
            line=$(jq -r '"\(.message) (merge type: \(.merge_type // "none"))"' <<<"$out" 2>/dev/null || echo "$out")
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$out"
            {
              echo "### Sync with upstream failed"
              echo
              echo '```'
              echo "$out"
              echo '```'
              echo
              echo "Likely causes: upstream changed a file under \`.github/workflows/\`, which the default token may not push, or the merge conflicts with a change made in this fork."
              echo
              echo "To fix now: open the repository page and use **Sync fork**."
              echo
              echo "To stop it recurring: add a repository secret \`SYNC_TOKEN\`, a fine-grained token for this repository with Contents and Workflows set to read and write."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
